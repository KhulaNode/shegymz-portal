services:
  budibase-apps:
    image: budibase/apps:3.38.0
    restart: unless-stopped
    environment:
      SELF_HOSTED: 1
      LOG_LEVEL: info
      PORT: 4002
      INTERNAL_API_KEY: ${BB_INTERNAL_API_KEY}
      API_ENCRYPTION_KEY: ${BB_API_ENCRYPTION_KEY}
      JWT_SECRET: ${BB_JWT_SECRET}
      MINIO_ACCESS_KEY: ${BB_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${BB_MINIO_SECRET_KEY}
      MINIO_URL: http://budibase-minio:9000
      REDIS_URL: budibase-redis:6379
      REDIS_PASSWORD: ${BB_REDIS_PASSWORD}
      WORKER_URL: http://budibase-worker:4003
      COUCH_DB_USERNAME: budibase
      COUCH_DB_PASSWORD: ${BB_COUCHDB_PASSWORD}
      COUCH_DB_URL: http://budibase:${BB_COUCHDB_PASSWORD}@budibase-couchdb:5984
      BUDIBASE_ENVIRONMENT: ${BUDIBASE_ENVIRONMENT:-PRODUCTION}
      ENABLE_ANALYTICS: ${ENABLE_ANALYTICS:-true}
      BB_ADMIN_USER_EMAIL: ${BB_ADMIN_USER_EMAIL:-}
      BB_ADMIN_USER_PASSWORD: ${BB_ADMIN_USER_PASSWORD:-}
    depends_on:
      budibase-worker:
        condition: service_healthy
      budibase-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -qO-
        - http://localhost:4002/health
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    networks:
      - shegymz-network

  budibase-worker:
    image: budibase/worker:3.38.0
    restart: unless-stopped
    environment:
      SELF_HOSTED: 1
      LOG_LEVEL: info
      PORT: 4003
      CLUSTER_PORT: 10000
      INTERNAL_API_KEY: ${BB_INTERNAL_API_KEY}
      API_ENCRYPTION_KEY: ${BB_API_ENCRYPTION_KEY}
      JWT_SECRET: ${BB_JWT_SECRET}
      MINIO_ACCESS_KEY: ${BB_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${BB_MINIO_SECRET_KEY}
      APPS_URL: http://budibase-apps:4002
      MINIO_URL: http://budibase-minio:9000
      REDIS_URL: budibase-redis:6379
      REDIS_PASSWORD: ${BB_REDIS_PASSWORD}
      COUCH_DB_USERNAME: budibase
      COUCH_DB_PASSWORD: ${BB_COUCHDB_PASSWORD}
      COUCH_DB_URL: http://budibase:${BB_COUCHDB_PASSWORD}@budibase-couchdb:5984
      BUDIBASE_ENVIRONMENT: ${BUDIBASE_ENVIRONMENT:-PRODUCTION}
      ENABLE_ANALYTICS: ${ENABLE_ANALYTICS:-true}
    depends_on:
      budibase-redis:
        condition: service_healthy
      budibase-minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -qO-
        - http://localhost:4003/health
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    networks:
      - shegymz-network

  budibase-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${BB_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BB_MINIO_SECRET_KEY}
      MINIO_BROWSER: off
    command: server /data --console-address ":9001"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shegymz-network

  budibase-proxy:
    image: budibase/proxy:3.38.0
    restart: unless-stopped
    environment:
      PROXY_RATE_LIMIT_WEBHOOKS_PER_SECOND: 10
      PROXY_RATE_LIMIT_API_PER_SECOND: 20
      APPS_UPSTREAM_URL: http://budibase-apps:4002
      WORKER_UPSTREAM_URL: http://budibase-worker:4003
      MINIO_UPSTREAM_URL: http://budibase-minio:9000
      COUCHDB_UPSTREAM_URL: http://budibase-couchdb:5984
      RESOLVER: 127.0.0.11
    depends_on:
      budibase-minio:
        condition: service_healthy
      budibase-worker:
        condition: service_healthy
      budibase-apps:
        condition: service_healthy
      budibase-couchdb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:10000/
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    # ports:
    #   - "10000:10000"
    networks:
      - shegymz-network

  budibase-couchdb:
    image: budibase/couchdb:v3.3.3
    restart: unless-stopped
    environment:
      COUCHDB_USER: budibase
      COUCHDB_PASSWORD: ${BB_COUCHDB_PASSWORD}
      TARGETBUILD: docker-compose
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:5984/
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    volumes:
      - couchdb3_data:/opt/couchdb/data
    networks:
      - shegymz-network

  budibase-redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass "${BB_REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${BB_REDIS_PASSWORD}
        - ping
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    networks:
      - shegymz-network

  postgres:
    image: postgres:16
    container_name: shegymz-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # ports:
    #   - "5432:5432"
    volumes:
      - portal-postgres-data:/var/lib/postgresql/data
    networks:
      shegymz-network:
        aliases:
          - shegymz-db
          - shegymz-portal-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shegymz-portal-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_URL: http://localhost:3001
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      AUTH_SECRET: ${AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PLAN_CODE: ${PAYSTACK_PLAN_CODE}
      PLUNK_API_KEY: ${PLUNK_API_KEY}
      PLUNK_FROM_EMAIL: ${PLUNK_FROM_EMAIL}
      PORTAL_CONTACT_EMAIL: ${PORTAL_CONTACT_EMAIL}
      NODE_ENV: production
    # ports:
    #   - "3001:3001"
    networks:
      - shegymz-network

  admin-ui:
    build:
      context: .
      dockerfile: admin-ui/Dockerfile
    container_name: shegymz-admin-ui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./admin-ui/.env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      NODE_ENV: production
    volumes:
      - admin-ui-data:/data
    # ports:
    #   - "3002:3002"
    networks:
      - shegymz-network

volumes:
  minio_data:
  couchdb3_data:
  redis_data:
  portal-postgres-data:
  admin-ui-data:

networks:
  shegymz-network:
