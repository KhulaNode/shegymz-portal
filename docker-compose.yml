services:
  postgres:
    image: postgres:16
    container_name: shegymz-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - portal-postgres-data:/var/lib/postgresql/data
    networks:
      - shegymz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  metabase-postgres:
    image: postgres:16-alpine
    container_name: shegymz-portal-metabase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabasedb
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-metabase_secret}
    volumes:
      - metabase-postgres-data:/var/lib/postgresql/data
    networks:
      - shegymz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabasedb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  metabase:
    image: metabase/metabase:latest
    container_name: shegymz-portal-metabase
    restart: unless-stopped
    depends_on:
      metabase-postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabasedb
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase_secret}
      MB_DB_HOST: metabase-postgres
    volumes:
      - metabase-data:/metabase-data
    networks:
      - shegymz-network
    ports:
      - "3002:3000"

  portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shegymz-portal-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_URL: http://localhost:3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PLAN_CODE: ${PAYSTACK_PLAN_CODE}
      PLUNK_API_KEY: ${PLUNK_API_KEY}
      PLUNK_FROM_EMAIL: ${PLUNK_FROM_EMAIL}
      PORTAL_CONTACT_EMAIL: ${PORTAL_CONTACT_EMAIL}
      NODE_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - portal-node-modules:/app/node_modules
      - portal-next-cache:/app/.next
    networks:
      - shegymz-network

volumes:
  portal-postgres-data:
  metabase-data:
  metabase-postgres-data:
  portal-node-modules:
  portal-next-cache:

networks:
  shegymz-network:
