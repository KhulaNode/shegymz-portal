services:
  postgres:
    image: postgres:16
    container_name: shegymz-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - portal-postgres-data:/var/lib/postgresql/data
    networks:
      shegymz-network:
        aliases:
          - shegymz-db
          - shegymz-portal-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shegymz-portal-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_URL: http://localhost:3001
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER}:***@postgres:5432/${POSTGRES_DB}}
      AUTH_SECRET: ${AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PLAN_CODE: ${PAYSTACK_PLAN_CODE}
      PLUNK_API_KEY: ${PLUNK_API_KEY}
      PLUNK_FROM_EMAIL: ${PLUNK_FROM_EMAIL}
      PORTAL_CONTACT_EMAIL: ${PORTAL_CONTACT_EMAIL}
      NODE_ENV: production
    networks:
      - shegymz-network

  admin-ui:
    build:
      context: .
      dockerfile: admin-ui/Dockerfile
    container_name: shegymz-admin-ui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL_ADMIN:-http://localhost:3002}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER}:***@postgres:5432/${POSTGRES_DB}}
      NODE_ENV: production
    volumes:
      - admin-ui-data:/data
    networks:
      - shegymz-network

volumes:
  portal-postgres-data:
  admin-ui-data:

networks:
  shegymz-network: